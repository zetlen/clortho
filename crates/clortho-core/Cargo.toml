[package]
name = "clortho-core"
description = "Wire protocol, Assuan pinentry parser and local transport for clortho"
version.workspace = true
edition = "2024"
license.workspace = true
repository.workspace = true

[dependencies]
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "1"

[target."cfg(unix)".dependencies]
libc = "0.2"

[target."cfg(windows)".dependencies]
uds_windows = "1"
